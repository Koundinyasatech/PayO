name: CI/CD Full Pipeline

on:
  push:
    branches:
      - sathwikaDev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 🔧 Node Setup
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # 🔧 Java Setup
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔧 Android Build
      - name: Grant Permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      # 🐳 Docker Login
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 🐳 Build Image
      - name: Build Image
        run: docker build -t umarsharief/payo-frontend:latest .

      # 🐳 Push Image
      - name: Push Image
        run: docker push umarsharief/payo-frontend:latest

      # 🚀 Deploy to FRONTEND EC2 (SAFE)
      - name: Deploy to Frontend EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_EC2_SSH_KEY }}
          script: |
            docker stop payo-frontend || true
            docker rm payo-frontend || true
            docker pull umarsharief/payo-frontend:latest
            docker run -d -p 3001:3000 --name payo-frontend umarsharief/payo-frontend:latest
