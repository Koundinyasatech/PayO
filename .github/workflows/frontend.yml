name: Frontend APK Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Build Android APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        
            - name: Upload APK artifact     
              uses: actions/upload-artifact@v4      
              with:         
                name: app-release          
                path: app/build/outputs/apk/release/app-release.apk          
                retention-days: 30

      # 6. Configure AWS using GitHub OIDC
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 7. Verify AWS Authentication
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # 8. Get / Increment Version
      - name: Get / Increment Version
        run: |
          VERSION_FILE="version.txt"

          if aws s3 ls "s3://${{ secrets.S3_BUCKET_APPS }}/$VERSION_FILE"; then
            VERSION=$(aws s3 cp "s3://${{ secrets.S3_BUCKET_APPS }}/$VERSION_FILE" -)
            VERSION=$((VERSION + 1))
          else
            VERSION=1
          fi

          echo "$VERSION" > "$VERSION_FILE"

          aws s3 cp \
            "$VERSION_FILE" \
            "s3://${{ secrets.S3_BUCKET_APPS }}/$VERSION_FILE"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "PAYO Version: $VERSION"

      # 9. Upload APK to S3
      - name: Upload APK
        run: |
          DATE=$(date +'%Y-%m-%d-%H-%M')
          FILE_NAME="payo-v${VERSION}-${DATE}.apk"

          aws s3 cp \
            android/app/build/outputs/apk/release/app-release.apk \
            "s3://${{ secrets.S3_BUCKET_APPS }}/$FILE_NAME"

          echo "=================================="
          echo "PAYO APK Uploaded Successfully"
          echo "Version: $VERSION"
          echo "File: $FILE_NAME"
          echo "=================================="
