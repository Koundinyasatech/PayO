name: Frontend APK Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for GitHub OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

jobs:
  build-apk:
    name: Build and Upload APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout Code
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================================
      # 2. Setup Node.js
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # ==========================================================
      # 3. Setup Java
      # ==========================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. Install Dependencies
      # ==========================================================
      - name: Install Dependencies
        run: npm ci

      # ==========================================================
      # 5. Build Android Release APK
      # ==========================================================
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # ==========================================================
      # 6. Verify APK Exists
      # ==========================================================
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not found."
            exit 1
          fi

          echo "APK found successfully:"
          ls -lh "$APK_PATH"

      # ==========================================================
      # 7. Show GitHub Repository Information
      # ==========================================================
      - name: Show GitHub Repository Information
        run: |
          echo "=========================================="
          echo "GitHub Repository Information"
          echo "=========================================="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Repository Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Repository Owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Branch/Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "=========================================="

      # ==========================================================
      # 8. Inspect Actual GitHub OIDC Claims
      # ==========================================================
      # TEMPORARY DIAGNOSTIC STEP
      # This checks the actual OIDC token claims being sent
      # to AWS.
      - name: Inspect GitHub OIDC Claims
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Requesting GitHub OIDC Token"
          echo "=========================================="

          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Could not obtain GitHub OIDC token."
            exit 1
          fi

          echo "OIDC token received successfully."

          # Extract JWT payload
          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)

          # Convert Base64URL to Base64
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')

          # Add Base64 padding
          MOD=$(( ${#PAYLOAD} % 4 ))

          if [ "$MOD" -eq 2 ]; then
            PAYLOAD="${PAYLOAD}=="
          elif [ "$MOD" -eq 3 ]; then
            PAYLOAD="${PAYLOAD}="
          fi

          # Decode payload
          CLAIMS=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)

          if [ -z "$CLAIMS" ]; then
            echo "ERROR: Could not decode OIDC claims."
            exit 1
          fi

          echo "=========================================="
          echo "Actual GitHub OIDC Claims"
          echo "=========================================="

          echo "$CLAIMS" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            workflow
          }'

          echo "=========================================="

      # ==========================================================
      # 9. Configure AWS using GitHub OIDC
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-PAYO
          aws-region: ${{ secrets.AWS_REGION }}

      # ==========================================================
      # 10. Verify AWS Authentication
      # ==========================================================
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ==========================================================
      # 11. Get / Increment PAYO Version
      # ==========================================================
      - name: Get / Increment Version
        run: |
          VERSION_FILE="version.txt"

          echo "Checking existing PAYO version..."

          if aws s3 ls \
            "s3://${{ secrets.S3_BUCKET_NAME }}/$VERSION_FILE" \
            > /dev/null 2>&1; then

            echo "Existing version file found."

            VERSION=$(aws s3 cp \
              "s3://${{ secrets.S3_BUCKET_NAME }}/$VERSION_FILE" \
              -)

            VERSION=$((VERSION + 1))

          else

            echo "No existing version file found."
            VERSION=1

          fi

          echo "$VERSION" > "$VERSION_FILE"

          echo "Uploading updated version..."

          aws s3 cp \
            "$VERSION_FILE" \
            "s3://${{ secrets.S3_BUCKET_NAME }}/$VERSION_FILE"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PAYO Version: $VERSION"
          echo "=========================================="

      # ==========================================================
      # 12. Upload APK to Amazon S3
      # ==========================================================
      - name: Upload APK to S3
        run: |
          DATE=$(date +'%Y-%m-%d-%H-%M')

          FILE_NAME="payo-v${VERSION}-${DATE}.apk"

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          echo "Uploading APK..."
          echo "File: $FILE_NAME"

          aws s3 cp \
            "$APK_PATH" \
            "s3://${{ secrets.S3_BUCKET_NAME }}/$FILE_NAME"

          echo "=========================================="
          echo "PAYO APK UPLOADED SUCCESSFULLY"
          echo "=========================================="
          echo "Version : $VERSION"
          echo "File    : $FILE_NAME"
          echo "Bucket  : ${{ secrets.S3_BUCKET_NAME }}"
          echo "=========================================="
