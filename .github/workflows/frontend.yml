name: Frontend APK Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for GitHub OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

jobs:
  build-apk:
    name: Build and Upload APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout Code
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================================
      # 2. Setup Node.js
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # ==========================================================
      # 3. Setup Java
      # ==========================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. Install Dependencies
      # ==========================================================
      - name: Install Dependencies
        run: npm ci

      # ==========================================================
      # 5. Build Android Release APK
      # ==========================================================
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      # ==========================================================
      # 6. Verify APK Exists
      # ==========================================================
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not found."
            exit 1
          fi

          echo "APK found successfully:"
          ls -lh "$APK_PATH"

      # ==========================================================
      # 7. GitHub Repository / OIDC Diagnostic Information
      # ==========================================================
      # TEMPORARY STEP
      # This helps identify the exact GitHub repository identity
      # required by the AWS IAM OIDC trust policy.
      - name: Show GitHub OIDC Information
        run: |
          echo "=========================================="
          echo "GitHub Repository Information"
          echo "=========================================="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Repository Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Repository Owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Branch/Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "=========================================="

      # ==========================================================
      # 8. Configure AWS using GitHub OIDC
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-PAYO
          aws-region: ${{ secrets.AWS_REGION }}

      # ==========================================================
      # 9. Verify AWS Authentication
      # ==========================================================
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ==========================================================
      # 10. Get / Increment PAYO Version
      # ==========================================================
      - name: Get / Increment Version
        run: |
          VERSION_FILE="version.txt"

          echo "Checking existing PAYO version..."

          if aws s3 ls \
            "s3://${{ secrets.S3_BUCKET_NAME }}/$VERSION_FILE" \
            > /dev/null 2>&1; then

            echo "Existing version file found."

            VERSION=$(aws s3 cp \
              "s3://${{ secrets.S3_BUCKET_NAME }}/$VERSION_FILE" \
              -)

            VERSION=$((VERSION + 1))

          else

            echo "No existing version file found."
            VERSION=1

          fi

          echo "$VERSION" > "$VERSION_FILE"

          echo "Uploading updated version..."

          aws s3 cp \
            "$VERSION_FILE" \
            "s3://${{ secrets.S3_BUCKET_NAME }}/$VERSION_FILE"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PAYO Version: $VERSION"
          echo "=========================================="

      # ==========================================================
      # 11. Upload APK to Amazon S3
      # ==========================================================
      - name: Upload APK to S3
        run: |
          DATE=$(date +'%Y-%m-%d-%H-%M')

          FILE_NAME="payo-v${VERSION}-${DATE}.apk"

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          echo "Uploading APK..."
          echo "File: $FILE_NAME"

          aws s3 cp \
            "$APK_PATH" \
            "s3://${{ secrets.S3_BUCKET_NAME }}/$FILE_NAME"

          echo "=========================================="
          echo "PAYO APK UPLOADED SUCCESSFULLY"
          echo "=========================================="
          echo "Version : $VERSION"
          echo "File    : $FILE_NAME"
          echo "Bucket  : ${{ secrets.S3_BUCKET_NAME }}"
          echo "=========================================="
